name: SecOps Pipeline

on:
  repository_dispatch:
    types:
      - application_push

env:
  REGISTRY: ghcr.io
  OWNER: kaushalchauhan84850

jobs:
  # Stage 1 : Secret Scanning
  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Display Received Application Information
        run: |
          echo "SecOps Repo received Application trigger"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Verify Checked Out Commit
        run: |
          echo "Application Source Successfully checked out"
          echo "Checked Out Commit SHA:"
          git -C application rev-parse HEAD

      - name: Scan for Application Secrets
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --no-banner \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1

      - name: Show Detected Secrets
        if: always()
        run: |
          echo "Gitleaks Findings:"
          echo "====================================="
          if [ -f "application/gitleaks-report.json" ]; then
            cat application/gitleaks-report.json | jq -r '
              .[] | "File: \(.File)\nLine: \(.StartLine)\nRule: \(.RuleID)\nSecret: \(.Match)\nCommit: \(.Commit // "N/A")\n---"
            '
          else
            echo "No report file found — either no secrets were detected or the scan did not run."
          fi

  # Stage 2 : Dependency Scanning
  trivy:
    name: Trivy - Dependency Scanning
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Display Received Application Information
        run: |
          echo "SecOps Repo received Application trigger for dependency scan"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      - name: Scan Dependencies for Vulnerabilities
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1

      - name: Generate JSON Report of Findings
        if: always()
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /repo/trivy-report.json \
            --exit-code 0

      - name: Upload Trivy Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: application/trivy-report.json

  # Stage 3 : Build, Scan & Push (Backend + Frontend)
  build-scan-and-push:
    name: Build, Scan & Push Container Images
    runs-on: ubuntu-latest
    needs: trivy
    permissions:
      contents: read
      packages: write

    steps:
      - name: Display Received Application Information
        run: |
          echo "SecOps Repo received Application trigger for image build, scan & push"
          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          path: application

      # 1. Build Both Images Locally
      - name: Build Backend & Frontend Docker Images
        run: |
          COMMIT_SHA="${{ github.event.client_payload.commit_sha }}"
          
          echo "Building Backend Image..."
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-backend:${COMMIT_SHA} \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-backend:latest \
            -f application/backend/Dockerfile \
            application/backend

          echo "Building Frontend Image..."
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-frontend:${COMMIT_SHA} \
            -t ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-frontend:latest \
            -f application/frontend/Dockerfile \
            application/frontend

      # 2. Scan Backend Image
      - name: Scan Backend Docker Image
        run: |
          COMMIT_SHA="${{ github.event.client_payload.commit_sha }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-backend:${COMMIT_SHA} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1

      # 3. Scan Frontend Image
      - name: Scan Frontend Docker Image
        run: |
          COMMIT_SHA="${{ github.event.client_payload.commit_sha }}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-frontend:${COMMIT_SHA} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1

      # 4. Authenticate to GHCR (Runs only if scans pass)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      # 5. Push Images to GHCR
      - name: Push Images to GHCR
        run: |
          COMMIT_SHA="${{ github.event.client_payload.commit_sha }}"

          echo "Pushing Backend Image..."
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-backend:${COMMIT_SHA}
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-backend:latest

          echo "Pushing Frontend Image..."
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-frontend:${COMMIT_SHA}
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/hireflow-frontend:latest
